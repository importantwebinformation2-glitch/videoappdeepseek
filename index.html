<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>AI Video Studio · Pro Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #080c1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app-card {
      max-width: 820px;
      width: 100%;
      background: rgba(14, 22, 42, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 30px 28px;
      border: 1px solid #2e4068;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
    }
    h1 {
      font-size: 2rem;
      color: #f0f4ff;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    h1 i { background: linear-gradient(135deg, #7b8cff, #f47aff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subhead {
      color: #9aa7c9;
      margin-bottom: 20px;
      padding-left: 14px;
      border-left: 3px solid #7b8cff;
      font-size: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .input-area {
      background: #0f162b;
      border-radius: 28px;
      padding: 16px 20px;
      border: 1px solid #2e3a5a;
      margin-bottom: 16px;
    }
    .input-area:focus-within { border-color: #7b8cff; box-shadow: 0 0 0 4px rgba(123, 140, 255, 0.15); }
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e9efff;
      font-size: 1rem;
      resize: vertical;
      min-height: 90px;
      line-height: 1.6;
    }
    textarea::placeholder { color: #5d6f93; }
    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 16px 0 18px;
    }
    .control-group {
      background: #111a30;
      border-radius: 20px;
      padding: 12px 16px;
      border: 1px solid #263153;
    }
    .control-group label {
      display: block;
      font-size: 0.75rem;
      color: #8d9fcb;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .control-group select, .control-group input {
      width: 100%;
      background: #0b101f;
      border: 1px solid #2e3a5a;
      border-radius: 40px;
      padding: 10px 14px;
      color: #e9efff;
      font-size: 0.9rem;
      outline: none;
    }
    .control-group select option { background: #111a30; }
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 6px 0 18px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #5f73e0, #8b5cf6);
      border: none;
      padding: 16px 28px;
      border-radius: 60px;
      font-weight: 600;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      flex: 2 1 auto;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(91, 104, 224, 0.35);
      transition: 0.2s;
    }
    .btn-primary:hover { transform: scale(1.02); box-shadow: 0 12px 28px rgba(91, 104, 224, 0.55); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #384568;
      padding: 16px 22px;
      border-radius: 60px;
      color: #cdd9ff;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      flex: 1 1 auto;
      justify-content: center;
      transition: 0.2s;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); border-color: #5f73e0; }
    .preview-box {
      background: #080c1a;
      border-radius: 28px;
      padding: 14px;
      border: 1px solid #263153;
      margin: 14px 0 16px;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      color: #8d9fcb;
      font-size: 0.85rem;
      padding: 0 8px 12px 8px;
      border-bottom: 1px solid #1e2844;
    }
    #videoPreview {
      width: 100%;
      border-radius: 18px;
      background: #03050b;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      border: 1px solid #30406a;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #18213a;
      padding: 8px 18px;
      border-radius: 40px;
      color: #b0c2f0;
      font-size: 0.85rem;
      border: 1px solid #31416b;
      margin-top: 12px;
    }
    .status-badge i { color: #6fefb0; }
    .download-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 0 6px;
    }
    .download-btn {
      background: #1f2940;
      border: 1px solid #36476b;
      padding: 12px 20px;
      border-radius: 40px;
      color: #d3defa;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex: 1 1 120px;
      justify-content: center;
      transition: 0.2s;
    }
    .download-btn:hover { background: #2b3857; border-color: #7b8cff; color: white; }
    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: #4a5d84;
      border-top: 1px dashed #1f2d4a;
      padding-top: 16px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer-note span i { margin-right: 6px; color: #5f73e0; }
    @media (max-width: 550px) {
      .app-card { padding: 20px 16px; }
      .control-grid { grid-template-columns: 1fr; }
      .action-bar, .download-group { flex-direction: column; }
      .btn-primary, .btn-secondary, .download-btn { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app-card">
  <h1><i class="fas fa-crown"></i> AI Studio Pro</h1>
  <div class="subhead">
    <span><i class="fas fa-infinity"></i> Unlimited · Smart duration</span>
    <span><i class="fas fa-music"></i> Style: <span id="selectedMusicLabel">Ambient</span></span>
  </div>

  <div class="input-area">
    <textarea id="textInput" placeholder="Describe your video scene, product, or music video idea..." rows="4">A futuristic city at sunrise with glowing neon towers, flying vehicles, and a gentle river reflecting the sky.</textarea>
  </div>

  <div class="control-grid">
    <div class="control-group">
      <label><i class="fas fa-clock"></i> Duration (seconds)</label>
      <input type="number" id="durationInput" value="45" min="10" max="300" step="5">
    </div>
    <div class="control-group">
      <label><i class="fas fa-music"></i> Music Style</label>
      <select id="musicStyleSelect">
        <option value="ambient">🌿 Ambient · Calm</option>
        <option value="hiphop">🎧 Hip Hop · Urban</option>
        <option value="instrumental">🎹 Instrumental · Epic</option>
        <option value="electronic">⚡ Electronic · Energetic</option>
        <option value="cinematic">🎬 Cinematic · Dramatic</option>
      </select>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn-primary" id="generateBtn"><i class="fas fa-wand-magic-sparkles"></i> Generate Video</button>
    <button class="btn-secondary" id="randomBtn"><i class="fas fa-dice"></i> Random Prompt</button>
  </div>

  <div class="preview-box">
    <div class="preview-header"><span><i class="fas fa-film"></i> Preview</span><span><i class="fas fa-volume-high"></i> Dynamic audio</span></div>
    <video id="videoPreview" controls playsinline muted><source src="" type="video/mp4">Your browser does not support the video tag.</video>
    <div class="status-badge" id="statusBadge"><i class="fas fa-circle-check"></i> <span id="statusText">Ready</span></div>
  </div>

  <div class="download-group">
    <button class="download-btn" id="downloadMobileBtn"><i class="fas fa-mobile-screen-button"></i> Mobile</button>
    <button class="download-btn" id="downloadComputerBtn"><i class="fas fa-desktop"></i> Computer</button>
  </div>

  <div class="footer-note">
    <span><i class="fas fa-cloud-arrow-down"></i> Download any time</span>
    <span><i class="fas fa-infinity"></i> No limits · Pro features</span>
    <span><i class="fas fa-robot"></i> AI generated</span>
  </div>
</div>

<script>
  (function() {
    // DOM refs
    const video = document.getElementById('videoPreview');
    const statusText = document.getElementById('statusText');
    const statusBadge = document.getElementById('statusBadge');
    const textInput = document.getElementById('textInput');
    const durationInput = document.getElementById('durationInput');
    const musicStyleSelect = document.getElementById('musicStyleSelect');
    const selectedMusicLabel = document.getElementById('selectedMusicLabel');
    const generateBtn = document.getElementById('generateBtn');
    const randomBtn = document.getElementById('randomBtn');
    const downloadMobile = document.getElementById('downloadMobileBtn');
    const downloadComputer = document.getElementById('downloadComputerBtn');

    // Update label on music change
    musicStyleSelect.addEventListener('change', () => {
      const text = musicStyleSelect.options[musicStyleSelect.selectedIndex].text;
      selectedMusicLabel.textContent = text.split('·')[1]?.trim() || text;
    });
    selectedMusicLabel.textContent = musicStyleSelect.options[0].text.split('·')[1]?.trim() || 'Ambient';

    const sampleTexts = [
      "A breathtaking sunset over a calm ocean with dolphins jumping.",
      "Cyberpunk night market, neon signs, rain, and crowded streets.",
      "Serene forest with sunlight filtering through leaves, birds singing.",
      "A futuristic space station orbiting Earth, stars in the background.",
      "Ancient ruins in a jungle, with a mysterious glowing artifact.",
      "A bustling European city square with street musicians and cafes.",
      "Underwater coral reef with colorful fish and a sea turtle.",
      "A quiet snowy village at night, warm lights in the windows.",
      "A high-speed train zooming through a hyperloop tunnel.",
      "Astronaut walking on Mars with a massive red planet in the sky.",
      "Promote this amazing wireless earbuds with noise cancellation and deep bass.",
      "Unboxing the latest 4K action camera with waterproof and stabilization.",
      "Music video: neon lights, dancers, and a futuristic city vibe.",
      "Relaxing lo-fi beats with a rainy window and cozy room aesthetic."
    ];

    function setStatus(message, isGenerating = false) {
      statusText.textContent = message;
      const icon = statusBadge.querySelector('i');
      if (isGenerating) {
        statusBadge.style.borderColor = '#f5b342';
        statusBadge.style.background = '#2f2a1a';
        icon.className = 'fas fa-spinner fa-pulse';
        icon.style.color = '#f5b342';
      } else {
        statusBadge.style.borderColor = '#31416b';
        statusBadge.style.background = '#18213a';
        icon.className = 'fas fa-circle-check';
        icon.style.color = '#6fefb0';
      }
    }

    // ---------- Generate video with selected duration and music ----------
    function generateProVideo(text) {
      if (!text || text.trim() === '') {
        setStatus('Please enter some text.', false);
        return;
      }

      let duration = parseInt(durationInput.value) || 45;
      if (duration < 5) duration = 5;
      if (duration > 300) duration = 300;
      durationInput.value = duration;

      const musicStyle = musicStyleSelect.value;

      setStatus(`Generating ${duration}s video with ${musicStyle}...`, true);
      generateBtn.disabled = true;
      generateBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Creating...';

      setTimeout(() => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 640;
          canvas.height = 360;
          const ctx = canvas.getContext('2d');

          // ---- Scene parameters based on text ----
          const seed = text.length + text.charCodeAt(0) + text.charCodeAt(text.length-1) || 42;
          const baseHue = (seed * 27) % 360;
          const totalFrames = Math.floor(duration * 30); // 30fps

          // ---- Music: Dynamic based on style ----
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0.30, audioCtx.currentTime);
          gainNode.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + duration);
          gainNode.connect(audioCtx.destination);

          // Create oscillators based on style
          const oscillators = [];
          const styleConfigs = {
            ambient: { types: ['sine', 'sine'], freqs: [130, 170], gains: [0.25, 0.15] },
            hiphop: { types: ['square', 'sawtooth'], freqs: [80, 160], gains: [0.2, 0.18] },
            instrumental: { types: ['sawtooth', 'triangle'], freqs: [110, 220], gains: [0.2, 0.15] },
            electronic: { types: ['square', 'sine'], freqs: [100, 200], gains: [0.22, 0.16] },
            cinematic: { types: ['sawtooth', 'sine'], freqs: [90, 180], gains: [0.25, 0.2] }
          };
          const config = styleConfigs[musicStyle] || styleConfigs.ambient;

          for (let i = 0; i < config.types.length; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = config.types[i];
            osc.frequency.setValueAtTime(config.freqs[i], audioCtx.currentTime);
            // Add some movement
            osc.frequency.linearRampToValueAtTime(config.freqs[i] * 1.2, audioCtx.currentTime + duration * 0.5);
            osc.frequency.linearRampToValueAtTime(config.freqs[i] * 0.8, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(config.gains[i], audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(config.gains[i] * 0.3, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(gainNode);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration + 0.5);
            oscillators.push(osc);
          }

          // ---- Capture ----
          const stream = canvas.captureStream(30);
          const audioStreamDestination = audioCtx.createMediaStreamDestination();
          gainNode.connect(audioStreamDestination);
          const audioTrack = audioStreamDestination.stream.getAudioTracks()[0];
          const videoTrack = stream.getVideoTracks()[0];
          const combinedStream = new MediaStream([videoTrack, audioTrack]);

          const recorder = new MediaRecorder(combinedStream, {
            mimeType: 'video/webm;codecs=vp8,opus',
            videoBitsPerSecond: 2500000,
          });

          const chunks = [];
          recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            video.src = url;
            video.muted = false;
            video.controls = true;
            video.dataset.blobUrl = url;
            video.dataset.blob = blob;
            setStatus(`Video ready · ${duration}s · ${musicStyle}`, false);
            generateBtn.disabled = false;
            generateBtn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Generate Video';
            video.play().catch(() => {});
          };

          recorder.start();

          // ---- Animation loop ----
          let startTime = performance.now();
          let frame = 0;

          function animateCanvas() {
            const elapsed = (performance.now() - startTime) / 1000;
            if (elapsed >= duration || recorder.state !== 'recording') {
              if (recorder.state === 'recording') recorder.stop();
              return;
            }
            frame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dynamic background based on text and time
            const hueShift = (baseHue + elapsed * 1.5) % 360;
            const grad = ctx.createRadialGradient(
              canvas.width/2 + Math.sin(elapsed * 0.1) * 100,
              canvas.height/2 + Math.cos(elapsed * 0.12) * 100,
              50,
              canvas.width/2 + Math.sin(elapsed * 0.15 + 2) * 80,
              canvas.height/2 + Math.cos(elapsed * 0.1 + 1) * 80,
              400
            );
            grad.addColorStop(0, `hsl(${hueShift}, 75%, 30%)`);
            grad.addColorStop(0.5, `hsl(${(hueShift + 50) % 360}, 70%, 20%)`);
            grad.addColorStop(1, `hsl(${(hueShift + 100) % 360}, 80%, 10%)`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dynamic shapes (more movement)
            for (let i = 0; i < 30; i++) {
              const x = (Math.sin(elapsed * (0.08 + i * 0.015) + i * 1.2) * 0.5 + 0.5) * canvas.width;
              const y = (Math.cos(elapsed * (0.07 + i * 0.012) + i * 1.8) * 0.5 + 0.5) * canvas.height;
              const radius = 12 + Math.sin(elapsed * 0.5 + i) * 10 + 8;
              ctx.beginPath();
              ctx.arc(x, y, radius, 0, Math.PI * 2);
              ctx.fillStyle = `hsla(${(hueShift + i * 25 + elapsed * 20) % 360}, 85%, 70%, 0.15)`;
              ctx.fill();
            }

            // Text rendering with dynamic style
            const lines = text.split('\n').filter(l => l.trim().length > 0);
            let displayText = lines.length > 0 ? lines[0] : text;
            if (displayText.length > 70) displayText = displayText.slice(0, 67) + '…';

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 2;

            const textY = canvas.height/2 + Math.sin(elapsed * 0.2) * 20;
            ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(displayText, canvas.width/2, textY - 10);

            ctx.font = '18px "Segoe UI", system-ui, sans-serif';
            ctx.fillStyle = '#d0ddff';
            ctx.shadowBlur = 15;
            const styleLabel = musicStyle.charAt(0).toUpperCase() + musicStyle.slice(1);
            ctx.fillText(`✦ ${styleLabel} · ${duration}s ✦`, canvas.width/2, textY + 50);

            ctx.shadowBlur = 0;
            requestAnimationFrame(animateCanvas);
          }

          animateCanvas();

          // Stop recording after duration
          setTimeout(() => {
            if (recorder.state === 'recording') recorder.stop();
            setTimeout(() => audioCtx.close().catch(() => {}), 300);
          }, duration * 1000 + 200);

        } catch (err) {
          console.error(err);
          setStatus('Error generating video. Retry.', false);
          generateBtn.disabled = false;
          generateBtn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Generate Video';
        }
      }, 500);
    }

    // ---------- Download ----------
    function downloadVideo(device) {
      const blob = video.dataset.blob;
      if (!blob) {
        setStatus('Generate a video first!', false);
        return;
      }
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `ai-video-${device}-${Date.now()}.webm`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(link.href), 5000);
      setStatus(`Downloading for ${device} ...`, false);
    }

    // ---------- Event listeners ----------
    generateBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      if (!text) { setStatus('Please enter text.', false); return; }
      generateProVideo(text);
    });

    randomBtn.addEventListener('click', () => {
      const randomIndex = Math.floor(Math.random() * sampleTexts.length);
      textInput.value = sampleTexts[randomIndex];
      setStatus('Random prompt loaded. Generate!', false);
    });

    downloadMobile.addEventListener('click', () => downloadVideo('mobile'));
    downloadComputer.addEventListener('click', () => downloadVideo('computer'));

    setStatus('Ready · Set duration & music style', false);

    // Auto-generate a sample on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        textInput.value = sampleTexts[4]; // Ancient ruins
        generateProVideo(sampleTexts[4]);
      }, 500);
    });
  })();
</script>
</body>
</html>
